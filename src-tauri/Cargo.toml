[package]
name = "papinho"
version = "0.1.0"
description = "Papinho - chat com todos os seus agentes de IA juntos"
authors = ["Rafael Domingues"]
edition = "2021"

# builds de dev / `tauri build --debug`: encolhe o target/.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[lib]
name = "papinho_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "sync", "io-util"] }
thiserror = "2"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
